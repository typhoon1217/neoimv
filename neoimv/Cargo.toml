[package]
name = "neoimv"
version = "0.1.0"
edition = "2021"

[[test]]
name = "plugin_loading"
path = "tests/integration/plugin_loading.rs"

[dependencies]
neoimv-plugin-sdk = { path = "../neoimv-plugin-sdk" }
eframe = "0.31"
egui = "0.31"
image = { version = "0.25", features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5"
thiserror = "2"
libloading = "0.8"
natord = "1.0"
reqwest = { version = "0.12", features = ["blocking", "json"] }
sha2 = "0.10"
serde_json = "1"
rfd = "0.15"
